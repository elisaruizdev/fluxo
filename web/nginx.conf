server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /healthz {
    access_log off;
    return 200 'ok';
  }

  # La API vive en otro contenedor: mismo origen para el navegador, sin CORS
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Necesario para WebSockets (paso 5)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # Los assets llevan hash en el nombre: se pueden cachear "para siempre"
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: cualquier ruta desconocida devuelve index.html y la resuelve Vue Router
  location / {
    try_files $uri $uri/ /index.html;
  }
}
