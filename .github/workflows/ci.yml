name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo a la misma rama cancela el run anterior: no tiene sentido terminarlo
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Mínimo privilegio: el workflow solo necesita leer el código
permissions:
  contents: read

jobs:
  api:
    name: API · lint, tests e integración
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      # El cliente de Prisma se genera (no está en git) y el lint con tipos lo necesita
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      # Testcontainers levanta Postgres y Redis reales: los runners de GitHub traen Docker
      - run: npm run test:e2e

  web:
    name: Web · tipos, tests y E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run test:run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-web
          path: web/playwright-report
          retention-days: 7

  fullstack:
    name: Docker Compose · E2E de punta a punta
    needs: [api, web]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Crear .env con un secreto aleatorio
        run: |
          cp .env.example .env
          sed -i "s|^JWT_ACCESS_SECRET=.*|JWT_ACCESS_SECRET=$(openssl rand -base64 48)|" .env

      # --wait espera a que todos los healthchecks estén en verde (o falla)
      - name: Levantar el stack
        run: docker compose up -d --build --wait

      - name: Tamaño de las imágenes
        run: |
          echo '### Imágenes Docker' >> "$GITHUB_STEP_SUMMARY"
          echo '| Imagen | Tamaño |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | --- |' >> "$GITHUB_STEP_SUMMARY"
          docker images --format '| {{.Repository}} | {{.Size}} |' | grep fluxo >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e:fullstack
        working-directory: web

      - name: Logs de los contenedores
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-fullstack
          path: web/playwright-report
          retention-days: 7
